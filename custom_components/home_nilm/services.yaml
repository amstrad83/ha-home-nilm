label_event:
  fields:
    event_id:
      required: true
      selector:
        text: {}
      example: a1b2c3d4e5
    name:
      required: true
      selector:
        text: {}
      example: Tostapane
    entry_id: &id001
      required: false
      selector:
        config_entry:
          integration: home_nilm
label_now:
  fields:
    name:
      required: true
      selector:
        text: {}
      example: Phon
    entry_id: *id001
dismiss_event:
  fields:
    event_id:
      required: true
      selector:
        text: {}
    entry_id: *id001
teach:
  fields:
    name:
      required: true
      selector:
        text: {}
      example: Frigorifero
    power:
      required: true
      selector:
        number:
          min: 1
          max: 10000
          step: 1
          mode: box
          unit_of_measurement: W
      example: 170
    reactive_ratio:
      required: false
      selector:
        number:
          min: -1
          max: 2
          step: 0.01
          mode: box
      example: 0.3
    duration_minutes:
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 0.5
          mode: box
          unit_of_measurement: min
      example: 14
    hours:
      required: false
      selector:
        object: {}
      example:
      - 7
      - 8
    samples:
      required: false
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: box
      example: 1
    entry_id: *id001
forget_appliance:
  fields:
    name:
      required: true
      selector:
        text: {}
    entry_id: *id001
rename_appliance:
  fields:
    name:
      required: true
      selector:
        text: {}
    new_name:
      required: true
      selector:
        text: {}
    entry_id: *id001
get_signatures:
  fields:
    entry_id: *id001
